name: Update tracker and deploy

on:
  schedule:
    # Every six hours. Offset off the hour because GitHub queues scheduled
    # runs heavily at :00 and they can be delayed by 10+ minutes.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Site/scraper changes redeploy; a data commit must not retrigger this.
    paths-ignore:
      - "data/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape regulators
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A scheduled run should not silently publish an empty file, so the
      # scraper exits non-zero when every source fails. It also reports
      # `changed` so a run that finds nothing new produces no commit -
      # data/news.json is rewritten every run because each item's `last_seen`
      # moves, and committing that alone would be four empty commits a day.
      # Summaries are generated once per document and then kept, so the
      # initial backfill spreads across several scheduled runs rather than
      # fetching every document at once. With no key configured the scraper
      # simply runs without them.
      - name: Scrape
        id: scrape
        env:
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER || 'gemini' }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
        run: python -m scraper.run --no-site-copy --summarise --summary-limit 40

      - name: Commit data changes
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.scrape.outputs.changed }}" != "true" ]; then
            echo "No new regulatory updates - nothing to commit."
            git checkout -- data/news.json
            # GitHub disables cron workflows after 60 days without repository
            # activity. Because this workflow deliberately commits nothing on a
            # quiet run, a long regulatory lull - or a silently broken scraper -
            # would let the schedule expire. Nudge the clock well before then.
            AGE=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
            echo "Days since last commit: ${AGE}"
            if [ "${AGE}" -ge 45 ]; then
              git commit --allow-empty \
                -m "chore: keep scheduled workflow alive (${AGE} days without changes)"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            git add data/news.json
            git commit -m "data: ${{ steps.scrape.outputs.added }} new, ${{ steps.scrape.outputs.summarised }} summarised, ${{ steps.scrape.outputs.total }} tracked ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Another run may have pushed while this one was scraping.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A scraper that quietly stops finding anything looks identical to a
      # quiet week. These annotations make the difference visible on the run.
      - name: Health check
        run: |
          python - <<'PY'
          import datetime
          import json

          with open("data/news.json", encoding="utf-8") as fh:
              d = json.load(fh)

          failed = d["sources"]["failed"]
          if failed:
              print("::warning::Sources unavailable this run: " + ", ".join(failed))

          items = d["items"]
          without = [i for i in items if not i.get("summary")]
          print(f"Summaries: {len(items) - len(without)}/{len(items)} "
                f"({len(without)} still pending).")
          if len(without) == len(items) and items:
              print("::warning::No document has a summary. Set a GEMINI_API_KEY "
                    "repository secret (or another provider's key) to enable them.")

          latest = d["date_range"]["latest"]
          if latest:
              age = (datetime.date.today() - datetime.date.fromisoformat(latest)).days
              print(f"Newest tracked item is {age} days old ({latest}).")
              if age > 60:
                  print(f"::warning::No new regulatory item in {age} days - "
                        "the scrapers may have broken. Check the source endpoints "
                        "documented in README.md.")
          PY

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("data/news.json", encoding="utf-8") as fh:
              d = json.load(fh)
          c = d["counts"]
          print(f"### {c['total']} updates tracked\n")
          print(f"Generated at `{d['generated_at']}`\n")
          for k, v in sorted(c["by_regulator"].items()):
              print(f"- **{k}**: {v}")
          if d["sources"]["failed"]:
              print("\n> Sources unavailable: " + ", ".join(d["sources"]["failed"]))
          PY

  deploy:
    name: Deploy to GitHub Pages
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scrape.outputs.sha }}
          fetch-depth: 0

      # Re-running an old workflow run checks out that run's commit and would
      # happily publish it, silently rolling the live site back. Deploy only
      # what is currently at the tip of the branch.
      - name: Refuse to deploy a stale commit
        run: |
          HERE=$(git rev-parse HEAD)
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          TIP=$(git rev-parse "origin/${GITHUB_REF_NAME}")
          if [ "${HERE}" != "${TIP}" ]; then
            echo "::error::Refusing to deploy ${HERE:0:8}: ${GITHUB_REF_NAME} is now at ${TIP:0:8}. Re-running an old run would roll the site back. Use 'Run workflow' on the Actions tab instead of re-running an old run."
            exit 1
          fi
          echo "Deploying ${HERE:0:8} (tip of ${GITHUB_REF_NAME})."

      # The frontend fetches ./data/news.json relative to itself, so the
      # canonical data file is copied into the published directory.
      # The deploy job runs on every scheduled run, including the many that
      # find no news and therefore commit nothing. Stamping the check time
      # into the published artifact - rather than into a committed file - lets
      # the site show "checked 20 minutes ago" without a commit per run.
      - name: Stage site
        run: |
          mkdir -p site/data
          cp data/news.json site/data/news.json
          printf '{"last_checked":"%s","run":"%s"}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > site/data/status.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
